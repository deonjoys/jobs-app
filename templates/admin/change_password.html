<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password | JobS Admin</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="site-head">
  <div class="header-actions start">
    <a href="/admin" class="brand-link" aria-label="Back to the dashboard">
      <span class="brand-mark">J</span>
      <span class="brand-copy">
        <strong>JobS Admin</strong>
        <small>Change password</small>
      </span>
    </a>
  </div>
  <div></div>
  <div class="header-actions">
    <a href="/admin" class="portal-pill">Dashboard</a>
    <a href="/admin/logout" class="portal-pill">Logout</a>
  </div>
</header>

<div class="wrap narrow-wrap" style="padding-top: 2rem;">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <div class="panel" style="margin-top:0;">
    <h2>Change admin password</h2>
    <form action="{{ url_for('change_password') }}" method="POST">
      <div class="field">
        <label for="current_password">Current password</label>
        <input type="password" id="current_password" name="current_password" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label for="new_password">New password</label>
        <input type="password" id="new_password" name="new_password" autocomplete="new-password" required>
      </div>
      <div class="field">
        <label for="confirm_password">Confirm new password</label>
        <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required>
      </div>
      <div class="btn-row">
        <button type="submit" class="btn-solid">Change password</button>
        <a href="{{ url_for('admin_dashboard') }}" class="btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>

<footer class="site-foot">JobS Admin — internal use only.</footer>

</body>
</html>
