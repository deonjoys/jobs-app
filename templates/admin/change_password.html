<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password | JobS Admin</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header class="site-head">
  <div class="brand">
    <div class="brand-mark">J</div>
    <div><h1>JobS Admin</h1><span class="sub">Change password</span></div>
  </div>
  <nav class="site-nav">
    <a href="/admin">Dashboard</a>
    <a href="/admin/logout">Logout</a>
  </nav>
</header>

<div class="wrap" style="padding-top: 1.5rem; max-width: 520px;">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="flash">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <div class="panel" style="margin-top:0;">
    <h2>Change admin password</h2>
    <form action="{{ url_for('change_password') }}" method="POST">
      <div class="field">
        <label>Current password</label>
        <input type="password" name="current_password" required>
      </div>
      <div class="field">
        <label>New password</label>
        <input type="password" name="new_password" required>
      </div>
      <div class="field">
        <label>Confirm new password</label>
        <input type="password" name="confirm_password" required>
      </div>
      <div class="btn-row">
        <button type="submit" class="btn-solid">Change password</button>
        <a href="{{ url_for('admin_dashboard') }}" class="btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>

<footer class="site-foot">JobS Admin — internal use only.</footer>

</body>
</html>
